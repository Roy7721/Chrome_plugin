<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f4f2fb;                 /* soft lavender, not stark white */
        color: #2b2740;
      }

      h3 { margin: 0; font-size: 16px; color: #4a3f8f; }
      .divider { border-bottom: 1px solid #e6e1f2; margin: 10px 0; }

      button {
        width: 100%;
        padding: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        color: white;
        background: #6c4fd8;                  /* the one brand accent */
        box-shadow: 0 2px 6px rgba(108, 79, 216, 0.3);
        transition: background 0.15s;
      }
      button:hover { background: #5a3fc0; }
      button:disabled {
        background: #c4b9ec;
        box-shadow: none;
        cursor: default;
      }

      #status { margin: 12px 0; font-size: 13px; color: #7a7690; }

      /* --- verdict headline --- */
      #verdict { font-size: 17px; font-weight: 700; margin: 8px 0 2px 0; color: #2b2740; }
      #subhead { font-size: 12px; color: #9a95ad; margin: 0 0 12px 0; }

      /* --- bars --- */
      .bar-row { display: flex; align-items: center; margin: 6px 0; font-size: 12px; }
      .bar-label { width: 58px; color: #5c576e; }
      .bar-track {
        flex: 1;
        background: #e6e1f2;                  /* track tinted to match bg */
        border-radius: 5px;
        overflow: hidden;
        height: 16px;
      }
      .bar-fill { height: 100%; width: 0%; border-radius: 5px; }
      .pos { background: #22b573; }
      .neu { background: #8b93a7; }
      .neg { background: #e05a5a; }
      .bar-percent { width: 40px; text-align: right; font-weight: 600; color: #4a4560; }
      .bar-count { width: 30px; text-align: right; color: #a5a0b5; }

      /* --- sample cards --- */
      .sample-group {
        background: white;
        border-radius: 10px;
        border-left: 4px solid #ccc;
        padding: 10px 12px;
        margin-top: 12px;
        box-shadow: 0 1px 4px rgba(43, 39, 64, 0.08);   /* the soft float */
      }
      .sample-group.pos { border-left-color: #22b573; }
      .sample-group.neu { border-left-color: #8b93a7; }
      .sample-group.neg { border-left-color: #e05a5a; }

      .sample-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #6c6684;
        margin-bottom: 8px;
      }
      .sample-badge {
        background: #f0edf9;
        color: #6c4fd8;
        border-radius: 10px;
        padding: 2px 9px;
        font-size: 11px;
        font-weight: 700;
      }
      .sample-item {
        font-size: 12px;
        color: #3d3950;
        line-height: 1.45;
        background: #f8f7fc;
        border-radius: 6px;
        padding: 7px 9px;
        margin: 5px 0;

        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h3>YT Comment Analyzer</h3>
    <div class="divider"></div>

    <button id="analyzeBtn">Analyze comments</button>

    <p id="status">Ready when you are.</p>

    <div id="results" style="display: none;">
      <div id="verdict"></div>
      <div id="subhead"></div>

      <div class="bar-row">
        <span class="bar-label">Positive</span>
        <div class="bar-track"><div id="posBar" class="bar-fill pos"></div></div>
        <span id="posPercent" class="bar-percent">0%</span>
        <span id="posCount" class="bar-count">0</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Neutral</span>
        <div class="bar-track"><div id="neuBar" class="bar-fill neu"></div></div>
        <span id="neuPercent" class="bar-percent">0%</span>
        <span id="neuCount" class="bar-count">0</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Negative</span>
        <div class="bar-track"><div id="negBar" class="bar-fill neg"></div></div>
        <span id="negPercent" class="bar-percent">0%</span>
        <span id="negCount" class="bar-count">0</span>
      </div>

      <div id="samples"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
