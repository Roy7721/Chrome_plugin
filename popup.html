<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        width: 300px;
        font-family: sans-serif;
        padding: 12px;
        margin: 0;
      }
      h3 { margin: 0 0 4px 0; }
      .divider { border-bottom: 1px solid #ddd; margin: 8px 0; }

      button {
        width: 100%;
        padding: 9px;
        font-size: 14px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        background: #7e57c2;
        color: white;
      }
      button:disabled { background: #b0a0d0; cursor: default; }

      #status { margin: 10px 0; font-size: 13px; color: #555; }

      /* --- verdict headline --- */
      #verdict { font-size: 16px; font-weight: bold; margin: 6px 0 2px 0; }
      #subhead { font-size: 12px; color: #777; margin: 0 0 10px 0; }

      /* --- bars --- */
      .bar-row { display: flex; align-items: center; margin: 5px 0; font-size: 12px; }
      .bar-label { width: 58px; }
      .bar-track {
        flex: 1; background: #eee; border-radius: 4px;
        overflow: hidden; height: 16px;
      }
      .bar-fill { height: 100%; width: 0%; }
      .pos { background: #4caf50; }
      .neu { background: #9e9e9e; }
      .neg { background: #f44336; }
      .bar-percent { width: 38px; text-align: right; }
      .bar-count { width: 30px; text-align: right; color: #888; }

      /* --- sample comments --- */
      .sample-group { margin-top: 12px; }
      .sample-heading { font-size: 13px; font-weight: bold; margin-bottom: 4px; }
      .sample-item {
        font-size: 12px; color: #444;
        background: #f5f5f5; border-radius: 4px;
        padding: 5px 7px; margin: 3px 0;
      }
    </style>
  </head>
  <body>
    <h3>YT Comment Analyzer</h3>
    <div class="divider"></div>

    <button id="analyzeBtn">Analyze comments</button>

    <p id="status">Ready when you are.</p>

    <div id="results" style="display: none;">
      <div id="verdict"></div>
      <div id="subhead"></div>

      <div class="bar-row">
        <span class="bar-label">Positive</span>
        <div class="bar-track"><div id="posBar" class="bar-fill pos"></div></div>
        <span id="posPercent" class="bar-percent">0%</span>
        <span id="posCount" class="bar-count">0</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Neutral</span>
        <div class="bar-track"><div id="neuBar" class="bar-fill neu"></div></div>
        <span id="neuPercent" class="bar-percent">0%</span>
        <span id="neuCount" class="bar-count">0</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Negative</span>
        <div class="bar-track"><div id="negBar" class="bar-fill neg"></div></div>
        <span id="negPercent" class="bar-percent">0%</span>
        <span id="negCount" class="bar-count">0</span>
      </div>

      <div id="samples"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
